name: Generate Snake Animation

on:
  schedule:
    # Runs automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.kazeemmuyideen }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # Reads your private contributions via the PAT secret
          GITHUB_TOKEN: ${{ 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 }}

      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ 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 }}
